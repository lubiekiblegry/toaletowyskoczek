
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Toaletowy Skoczek</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111827;
  color: white;
  font-family: Arial, sans-serif;
  touch-action: manipulation;
}

#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #83d4ff;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#record {
  position: absolute;
  top: max(12px, env(safe-area-inset-top));
  right: 12px;
  padding: 10px 14px;
  border-radius: 12px;
  background: #111827dd;
  font-weight: bold;
  font-size: 16px;
  text-align: right;
  z-index: 2;
}

#record span { color: #ffdc45; }

#score {
  position: absolute;
  top: max(14px, env(safe-area-inset-top));
  left: 14px;
  font-size: 23px;
  font-weight: bold;
  text-shadow: 1px 2px 4px #0008;
  z-index: 2;
}

#overlay {
  position: absolute;
  inset: 0;
  background: #101827b8;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
  z-index: 3;
}

#overlay h1 {
  font-size: clamp(30px, 8vw, 52px);
  margin: 10px;
}

#overlay p {
  font-size: clamp(16px, 4vw, 21px);
  line-height: 1.5;
}

button {
  border: 0;
  border-radius: 15px;
  padding: 16px 26px;
  background: #ffda44;
  color: #172033;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

#jump {
  position: absolute;
  right: 20px;
  bottom: max(22px, env(safe-area-inset-bottom));
  width: 95px;
  height: 95px;
  border-radius: 50%;
  background: #22c55e;
  color: white;
  font-size: 17px;
  z-index: 2;
  box-shadow: 0 4px 15px #0005;
}

#jump:active { transform: scale(.94); }
</style>
</head>

<body>
<div id="game">
  <canvas id="canvas"></canvas>

  <div id="score">Wynik: 0</div>

  <div id="record">
    🏆 REKORD<br>
    <span id="best">0</span>
  </div>

  <div id="overlay">
    <h1>🚽 Toaletowy Skoczek</h1>
    <p>Przeskakuj nad kiblami!<br>
    Każdy przeskoczony kibel to 1 punkt.</p>
    <button id="start">▶ START GRY</button>
  </div>

  <button id="jump">⬆ SKACZ!</button>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const scoreText = document.getElementById("score");
const bestText = document.getElementById("best");

const cities = [
  {name:"WARSZAWA", sky:"#83d4ff"},
  {name:"NOWY JORK", sky:"#9bc9f3"},
  {name:"PARYŻ", sky:"#f5c7a0"},
  {name:"TOKIO", sky:"#f4b9d0"},
  {name:"LONDYN", sky:"#b4c9dd"},
  {name:"DUBAJ", sky:"#ffd49b"},
  {name:"RZYM", sky:"#f4d9aa"},
  {name:"RIO DE JANEIRO", sky:"#8ee0ce"}
];

let W = 900, H = 420, ground = 330, scale = 1;
let city = cities[0];
let player, obstacles = [];
let score = 0, best = 0, speed = 6;
let spawnTimer = 0;
let running = false;
let lastTime = 0;
let animationId = null;

try {
  best = Number(localStorage.getItem("toaletowyRekord")) || 0;
} catch(e) {}

bestText.textContent = best;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  scale = Math.min(W / 900, H / 420);
  ground = H * 0.79;

  if (player) {
    player.y = Math.min(player.y, ground - player.h);
  }

  if (!running) draw();
}

window.addEventListener("resize", resize);

function startFullScreen() {
  if (!document.fullscreenElement &&
      document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
}

function newGame() {
  startFullScreen();

  if (animationId !== null) {
    cancelAnimationFrame(animationId);
  }

  city = cities[Math.floor(Math.random() * cities.length)];
  player = {
    x: W * 0.13,
    y: ground - 65,
    w: 42,
    h: 65,
    vy: 0,
    grounded: true
  };

  obstacles = [];
  score = 0;
  speed = Math.max(5, W / 150);
  spawnTimer = 55;
  running = true;
  lastTime = performance.now();

  overlay.style.display = "none";
  draw();
  animationId = requestAnimationFrame(loop);
}

function jump() {
  if (running && player.grounded) {
    player.vy = -Math.max(12, H / 40);
    player.grounded = false;
  }
}

document.getElementById("start").addEventListener("click", newGame);

document.getElementById("jump").addEventListener("pointerdown", e => {
  e.preventDefault();
  if (!running) newGame();
  else jump();
});

canvas.addEventListener("pointerdown", () => {
  if (running) jump();
});

document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    if (!running) newGame();
    else jump();
  }
});

function drawCity() {
  ctx.fillStyle = city.sky;
  ctx.fillRect(0, 0, W, H);

  // Słońce
  ctx.fillStyle = "#fff0a3";
  ctx.beginPath();
  ctx.arc(W * 0.8, H * 0.16, Math.min(W, H) * 0.06, 0, Math.PI * 2);
  ctx.fill();

  // Chmury
  ctx.fillStyle = "#ffffffbb";
  for (let i = 0; i < 4; i++) {
    const x = ((i * W / 3 - score * 1.5) % (W + 150) + W + 150) % (W + 150) - 60;
    const y = H * (0.13 + (i % 2) * 0.08);
    ctx.beginPath();
    ctx.arc(x, y, 18, 0, Math.PI * 2);
    ctx.arc(x + 22, y - 10, 25, 0, Math.PI * 2);
    ctx.arc(x + 45, y, 18, 0, Math.PI * 2);
    ctx.fill();
  }

  // Sylwetka miasta
  const buildingW = Math.max(45, W / 13);
  for (let i = 0; i < Math.ceil(W / buildingW) + 2; i++) {
    const x = i * buildingW - (score * 0.7 % buildingW);
    const bh = H * (0.19 + ((i * 37) % 13) / 100);

    ctx.fillStyle = ["#647b96", "#8c9fb3", "#526981"][i % 3];
    ctx.fillRect(x, ground - bh, buildingW - 4, bh);

    ctx.fillStyle = "#ffe8a1";
    for (let wy = ground - bh + 14; wy < ground - 10; wy += 24) {
      for (let wx = x + 9; wx < x + buildingW - 10; wx += 19) {
        ctx.fillRect(wx, wy, 8, 11);
      }
    }
  }

  // Droga
  ctx.fillStyle = "#424b5b";
  ctx.fillRect(0, ground, W, H - ground);

  ctx.fillStyle = "#f8dd6b";
  for (let x = 0; x < W + 100; x += 100) {
    const lineX = (x - score * 3 % 100 + 100) % (W + 100);
    ctx.fillRect(lineX, ground + (H - ground) * 0.5, 42, 5);
  }

  ctx.fillStyle = "#f5f5f5";
  ctx.fillRect(0, ground, W, 4);

  ctx.fillStyle = "#142033";
  ctx.font = `bold ${Math.max(15, Math.min(22, W / 35))}px Arial`;
  ctx.fillText("📍 " + city.name, 16, H * 0.12);
}

function drawPlayer() {
  const p = player;
  const s = Math.max(0.7, Math.min(1.2, H / 420));

  // Głowa
  ctx.fillStyle = "#ffd0a0";
  ctx.beginPath();
  ctx.arc(p.x + 22*s, p.y + 15*s, 16*s, 0, Math.PI*2);
  ctx.fill();

  // Włosy
  ctx.fillStyle = "#513728";
  ctx.fillRect(p.x + 9*s, p.y, 25*s, 7*s);

  // Koszulka
  ctx.fillStyle = "#3185ff";
  ctx.fillRect(p.x + 7*s, p.y + 30*s, 30*s, 24*s);

  // Ręce
  ctx.strokeStyle = "#ffd0a0";
  ctx.lineWidth = 5*s;
  ctx.beginPath();
  ctx.moveTo(p.x + 9*s, p.y + 35*s);
  ctx.lineTo(p.x, p.y + 44*s);
  ctx.moveTo(p.x + 36*s, p.y + 35*s);
  ctx.lineTo(p.x + 44*s, p.y + 43*s);
  ctx.stroke();

  // Nogi
  const swing = p.grounded ? Math.sin(performance.now()/70)*7*s : 0;
  ctx.strokeStyle = "#172033";
  ctx.lineWidth = 7*s;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(p.x + 15*s, p.y + 52*s);
  ctx.lineTo(p.x + 10*s + swing, p.y + 64*s);
  ctx.moveTo(p.x + 30*s, p.y + 52*s);
  ctx.lineTo(p.x + 35*s - swing, p.y + 64*s);
  ctx.stroke();

  ctx.fillStyle = "#172033";
  ctx.beginPath();
  ctx.arc(p.x + 28*s, p.y + 13*s, 2*s, 0, Math.PI*2);
  ctx.fill();
}

function drawToilet(o) {
  const s = Math.max(0.7, Math.min(1.2, H/420));
  ctx.save();
  ctx.translate(o.x, ground);
  ctx.scale(s, s);

  ctx.fillStyle = "#f8fafc";
  ctx.fillRect(13, -53, 36, 26);

  ctx.fillStyle = "#dbe5ef";
  ctx.beginPath();
  ctx.ellipse(31, -28, 29, 9, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.moveTo(5, -29);
  ctx.lineTo(55, -29);
  ctx.lineTo(50, -9);
  ctx.quadraticCurveTo(30, 5, 10, -9);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#dce5ed";
  ctx.fillRect(16, -8, 30, 9);
  ctx.restore();
}

function draw() {
  drawCity();

  for (const o of obstacles) drawToilet(o);
  if (player) drawPlayer();

  scoreText.textContent = "Wynik: " + score;
}

function endGame() {
  running = false;

  overlay.innerHTML = `
    <h1>💥 KONIEC GRY!</h1>
    <p>Miasto: ${city.name}</p>
    <p>Twój wynik: <b>${score}</b></p>
    <p>🏆 Rekord: <b>${best}</b></p>
    <button id="again">🔄 ZAGRAJ PONOWNIE</button>
  `;

  overlay.style.display = "flex";
  document.getElementById("again").addEventListener("click", newGame);
}

function loop(time) {
  if (!running) return;

  const dt = Math.min((time - lastTime) / 16.67, 2);
  lastTime = time;

  speed = Math.min(Math.max(5, W / 150) + score * 0.12, W / 65);

  // Fizyka skoku
  player.vy += 0.8 * dt;
  player.y += player.vy * dt;

  if (player.y >= ground - player.h) {
    player.y = ground - player.h;
    player.vy = 0;
    player.grounded = true;
  }

  // Tworzenie kibli
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    obstacles.push({x: W + 30, counted: false});
    spawnTimer = 75 + Math.random() * 35;
  }

  for (const o of obstacles) {
    o.x -= speed * dt;

    // Jeden punkt za minięty kibel
    if (!o.counted && o.x + 55 < player.x) {
      o.counted = true;
      score += 1;

      if (score > best) {
        best = score;
        bestText.textContent = best;
        try {
          localStorage.setItem("toaletowyRekord", String(best));
        } catch(e) {}
      }
    }
  }

  obstacles = obstacles.filter(o => o.x > -100);

  // Kolizja
  const ps = Math.max(0.7, Math.min(1.2, H/420));
  for (const o of obstacles) {
    const px = player.x + 6*ps;
    const py = player.y + 8*ps;

    if (
      px + 30*ps > o.x + 5*ps &&
      px < o.x + 53*ps &&
      py + 53*ps > ground - 53*ps &&
      py < ground
    ) {
      draw();
      endGame();
      return;
    }
  }

  draw();
  animationId = requestAnimationFrame(loop);
}

resize();
draw();
</script>
</body>
</html>
